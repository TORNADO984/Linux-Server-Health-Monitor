[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "server-health-monitor"
version = "0.1.0"
description = "Production-style Linux server health monitoring CLI built with Python, Docker, and CI/CD."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Server Health Monitor Contributors" },
]
keywords = ["linux", "devops", "monitoring", "cli", "server", "health", "systemadmin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "PyYAML>=6.0.1",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-psutil>=5.9.0",
    "types-PyYAML>=6.0.0",
    "build>=1.0.0",
]

[project.scripts]
server-health = "server_health.cli:app"

[project.urls]
Homepage = "https://github.com/TORNADO984/Linux-Server-Health-Monitor"
Repository = "https://github.com/TORNADO984/Linux-Server-Health-Monitor"
Issues = "https://github.com/TORNADO984/Linux-Server-Health-Monitor/issues"
Changelog = "https://github.com/TORNADO984/Linux-Server-Health-Monitor/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/server_health"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-v",
]
markers = [
    "integration: marks tests as integration tests (may be slower)",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]
ignore = [
    "E501",   # line too long - handled by formatter
    "B008",   # do not perform function calls in default arguments (typer uses this)
    "N805",   # first argument of a method should be named 'self'
]

[tool.ruff.lint.isort]
known-first-party = ["server_health"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]
